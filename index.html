<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#F4F6F8" />

    <title>차주 연락</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <section class="card" aria-label="차주 연락">
        <div class="plate">
          <div class="plate-number" id="plateNumber"></div>
        </div>

        <div class="message">
          <div class="message-title" id="messageTitle"></div>
        </div>

        <a class="call-button" id="callButton">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22 16.92V19.92C22 20.52 21.52 21 20.92 21C10.45 21 2 12.55 2 2.08C2 1.48 2.48 1 3.08 1H6.08C6.68 1 7.16 1.48 7.16 2.08C7.16 3.69 7.42 5.27 7.92 6.76C8.07 7.21 7.96 7.71 7.62 8.05L5.9 9.77C7.4 12.94 10.06 15.6 13.23 17.1L14.95 15.38C15.29 15.04 15.79 14.93 16.24 15.08C17.73 15.58 19.31 15.84 20.92 15.84C21.52 15.84 22 16.32 22 16.92Z"
              fill="currentColor"
            />
          </svg>

          <span id="callButtonText"></span>
        </a>
      </section>

      <p class="footer" id="footerText"></p>
    </main>

    <script src="config.js"></script>
    <script>
      const config = window.PRODUCT_CONFIG;

      document.title = config.pageTitle;
      document.getElementById("plateNumber").textContent =
        config.plateNumber;
      document.getElementById("messageTitle").textContent =
        config.messageTitle;
      document.getElementById("callButtonText").textContent =
        config.callButtonText;
      document.getElementById("footerText").textContent =
        config.footerText;

      const callButton = document.getElementById("callButton");
      callButton.href = `tel:${config.phoneNumber}`;
      callButton.setAttribute(
        "aria-label",
        `${config.plateNumber} 차량 소유자에게 전화 걸기`
      );
    </script>
  </body>
</html>
